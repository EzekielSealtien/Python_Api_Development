services:
  api:
    image: ezekiel001/ezekiel
    depends_on:
      - postgres
    ports:
      - "80:8000"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: { DATABASE_PASSWORD }
      POSTGRES_DB: { DATABASE_NAME }

    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
